name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install $COMPOSER_FLAGS
      - run: composer lint
      - run: composer audit

  cgl:
    name: Coding guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install $COMPOSER_FLAGS
      - run: composer cgl

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install $COMPOSER_FLAGS
      - run: composer phpstan -- --no-progress

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            experimental: false
          - php: '8.5'
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install $COMPOSER_FLAGS
      - run: composer test:unit

  functional:
    name: Functional tests (PHP ${{ matrix.php }}, MariaDB 10.11)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            experimental: false
          - php: '8.5'
            experimental: true
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
      typo3DatabaseName: typo3_functional
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2
      - run: composer install $COMPOSER_FLAGS
      - run: composer test:functional

  assets:
    name: Frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Committed build output must match the sources
        run: git diff --exit-code -- Resources/Public/Vite
      - run: npm audit --audit-level=high
