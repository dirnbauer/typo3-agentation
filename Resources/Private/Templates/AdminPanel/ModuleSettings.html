<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:render partial="Form/Checkbox" arguments="{
    label: 'LLL:EXT:agentation/Resources/Private/Language/locallang.xlf:adminpanel.enabled',
    name: 'agentation_enabled',
    languageKey: languageKey,
    value: enabled}" />

<div class="typo3-adminPanel-form-group">
    <div class="typo3-adminPanel-form-select">
        <label for="agentation_position" class="typo3-adminPanel-form-select-label">
            <f:translate key="adminpanel.position" domain="agentation.messages" languageKey="{languageKey}" />
        </label>
        <select name="TSFE_ADMIN_PANEL[agentation_position]" id="agentation_position" class="typo3-adminPanel-form-select-input">
            <f:for each="{positions}" as="option">
                <option value="{option}" {f:if(condition: '{option} == {position}', then: 'selected')}>
                    <f:translate key="adminpanel.position.{option}" domain="agentation.messages" languageKey="{languageKey}" />
                </option>
            </f:for>
        </select>
    </div>
</div>

<div class="typo3-adminPanel-form-group">
    <div class="typo3-adminPanel-form-select">
        <label for="agentation_scope" class="typo3-adminPanel-form-select-label">
            <f:translate key="adminpanel.scope" domain="agentation.messages" languageKey="{languageKey}" />
        </label>
        <select name="TSFE_ADMIN_PANEL[agentation_scope]" id="agentation_scope" class="typo3-adminPanel-form-select-input">
            <f:for each="{scopes}" as="option">
                <option value="{option}" {f:if(condition: '{option} == {scope}', then: 'selected')}>
                    <f:translate key="adminpanel.scope.{option}" domain="agentation.messages" languageKey="{languageKey}" />
                </option>
            </f:for>
        </select>
    </div>
</div>

</html>
