<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Before">
    <f:asset.module identifier="@typo3/backend/copy-to-clipboard.js" />
    <f:asset.module identifier="@typo3/backend/element/status-indicator-element.js" />
    <f:asset.module identifier="@webconsulting/agentation/module.js" />
    <f:asset.css identifier="agentation-module" href="EXT:agentation/Resources/Public/Css/Module.css" />
</f:section>

<f:section name="Content">

    <h1><f:translate key="module.heading" domain="agentation.mod" /></h1>
    <p><f:translate key="module.intro" domain="agentation.mod" /></p>

    <div class="card-container">

        <section class="card card-size-medium" aria-labelledby="agentation-connect-heading">
            <div class="card-header">
                <div class="card-icon">
                    <core:icon identifier="agentation-module" size="small" />
                </div>
                <div class="card-header-body">
                    <h2 class="card-title" id="agentation-connect-heading"><f:translate key="connect.heading" domain="agentation.mod" /></h2>
                    <span class="card-subtitle"><f:translate key="connect.intro" domain="agentation.mod" /></span>
                </div>
            </div>
            <div class="card-body">
                <f:if condition="{cloudMode}">
                    <f:then>
                        <f:be.infobox title="{f:translate(key: 'connect.cloudMode.title', domain: 'agentation.mod')}" state="0">
                            <f:translate key="connect.cloudMode.text" domain="agentation.mod" />
                        </f:be.infobox>
                    </f:then>
                    <f:else>
                        <f:be.infobox title="{f:translate(key: 'connect.localMode.title', domain: 'agentation.mod')}" state="-1">
                            <f:translate key="connect.localMode.text" domain="agentation.mod" />
                        </f:be.infobox>
                    </f:else>
                </f:if>

                <div class="form-group">
                    <label class="form-label" for="agentation-mcp-json"><f:translate key="connect.json.label" domain="agentation.mod" /></label>
                    <textarea
                        id="agentation-mcp-json"
                        class="form-control font-monospace"
                        rows="9"
                        readonly
                        spellcheck="false"
                        aria-describedby="agentation-mcp-json-hint"
                    >{mcpJson}</textarea>
                    <p class="form-text" id="agentation-mcp-json-hint"><f:translate key="connect.json.hint" domain="agentation.mod" /></p>
                </div>
                <div class="agentation-actions">
                    <typo3-copy-to-clipboard class="btn btn-primary" text="{mcpJson}">
                        <core:icon identifier="actions-clipboard" size="small" />
                        <f:translate key="connect.json.copy" domain="agentation.mod" />
                    </typo3-copy-to-clipboard>
                    <a class="btn btn-default" href="{cursorDeepLink}">
                        <core:icon identifier="actions-plus" size="small" />
                        <f:translate key="connect.addToCursor" domain="agentation.mod" />
                    </a>
                    <a class="btn btn-default" href="{mcpDocsUrl}" target="_blank" rel="noopener noreferrer">
                        <core:icon identifier="actions-window-open" size="small" />
                        <f:translate key="connect.docs" domain="agentation.mod" />
                    </a>
                </div>

                <div class="form-group">
                    <label class="form-label" for="agentation-claude-cli"><f:translate key="connect.claude.label" domain="agentation.mod" /></label>
                    <div class="input-group">
                        <input
                            id="agentation-claude-cli"
                            type="text"
                            class="form-control font-monospace"
                            readonly
                            value="{claudeCodeCli}"
                            aria-describedby="agentation-claude-cli-hint"
                        >
                        <typo3-copy-to-clipboard
                            class="btn btn-default"
                            text="{claudeCodeCli}"
                            title="{f:translate(key: 'connect.claude.copy', domain: 'agentation.mod')}"
                        >
                            <core:icon identifier="actions-clipboard" size="small" />
                            <span class="visually-hidden"><f:translate key="connect.claude.copy" domain="agentation.mod" /></span>
                        </typo3-copy-to-clipboard>
                    </div>
                    <p class="form-text" id="agentation-claude-cli-hint"><f:translate key="connect.claude.hint" domain="agentation.mod" /></p>
                </div>
            </div>
        </section>

        <section class="card" aria-labelledby="agentation-status-heading">
            <div class="card-header">
                <div class="card-header-body">
                    <h2 class="card-title" id="agentation-status-heading"><f:translate key="status.heading" domain="agentation.mod" /></h2>
                </div>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.sync" domain="agentation.mod" /></span>
                    <span>
                        <typo3-backend-status-indicator state="info"></typo3-backend-status-indicator>
                        <f:translate key="{f:if(condition: cloudMode, then: 'status.sync.cloud', else: 'status.sync.local')}" domain="agentation.mod" />
                    </span>
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.endpoint" domain="agentation.mod" /></span>
                    <code>{syncEndpoint}</code>
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.bundle" domain="agentation.mod" /></span>
                    <f:if condition="{bundleBuilt}">
                        <f:then><span><typo3-backend-status-indicator state="success"></typo3-backend-status-indicator> <f:translate key="status.bundle.built" domain="agentation.mod" /></span></f:then>
                        <f:else><span><typo3-backend-status-indicator state="danger"></typo3-backend-status-indicator> <f:translate key="status.bundle.missing" domain="agentation.mod" /></span></f:else>
                    </f:if>
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.context" domain="agentation.mod" /></span>
                    <f:if condition="{contextAllowed}">
                        <f:then><span><typo3-backend-status-indicator state="success"></typo3-backend-status-indicator> <f:translate key="status.context.allowed" domain="agentation.mod" /></span></f:then>
                        <f:else><span><typo3-backend-status-indicator state="warning"></typo3-backend-status-indicator> <f:translate key="status.context.blocked" domain="agentation.mod" /></span></f:else>
                    </f:if>
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.frontend" domain="agentation.mod" /></span>
                    <f:render section="Switch" arguments="{enabled: frontendEnabled}" />
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.backend" domain="agentation.mod" /></span>
                    <f:render section="Switch" arguments="{enabled: backendEnabled}" />
                </li>
                <li class="list-group-item agentation-status">
                    <span><f:translate key="status.project" domain="agentation.mod" /></span>
                    <f:if condition="{workspaceId}">
                        <f:then><code>{workspaceId}</code></f:then>
                        <f:else><span class="text-variant"><f:translate key="status.project.none" domain="agentation.mod" /></span></f:else>
                    </f:if>
                </li>
            </ul>
        </section>

        <section class="card" aria-labelledby="agentation-howto-heading">
            <div class="card-header">
                <div class="card-header-body">
                    <h2 class="card-title" id="agentation-howto-heading"><f:translate key="howto.heading" domain="agentation.mod" /></h2>
                </div>
            </div>
            <div class="card-body">
                <ol class="agentation-steps">
                    <li><f:translate key="howto.step1" domain="agentation.mod" /></li>
                    <li><f:translate key="howto.step2" domain="agentation.mod" /></li>
                    <li><f:translate key="howto.step3" domain="agentation.mod" /></li>
                    <li><f:translate key="howto.step4" domain="agentation.mod" /></li>
                </ol>
            </div>
        </section>

        <section class="card card-size-large" aria-labelledby="agentation-annotations-heading" data-agentation-annotations>
            <div class="card-header">
                <div class="card-header-body">
                    <h2 class="card-title" id="agentation-annotations-heading"><f:translate key="annotations.heading" domain="agentation.mod" /></h2>
                    <span class="card-subtitle" role="status" aria-live="polite" data-agentation-summary>
                        <f:translate key="annotations.loading" domain="agentation.mod" />
                    </span>
                </div>
                <div class="agentation-actions">
                    <button
                        type="button"
                        class="btn btn-default"
                        data-agentation-action="reload"
                        title="{f:translate(key: 'annotations.reload', domain: 'agentation.mod')}"
                    >
                        <core:icon identifier="actions-refresh" size="small" />
                        <span class="visually-hidden"><f:translate key="annotations.reload" domain="agentation.mod" /></span>
                    </button>
                    <button type="button" class="btn btn-default" data-agentation-action="delete-all" disabled>
                        <core:icon identifier="actions-delete" size="small" />
                        <f:translate key="annotations.deleteAll" domain="agentation.mod" />
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="callout callout-danger" data-agentation-error hidden>
                    <div class="callout-icon">
                        <span class="icon-emphasized"><core:icon identifier="actions-close" size="small" /></span>
                    </div>
                    <div class="callout-content">
                        <div class="callout-body" data-agentation-error-message></div>
                    </div>
                </div>
                <div class="agentation-empty" data-agentation-empty hidden>
                    <core:icon identifier="agentation-module" size="large" />
                    <p><f:translate key="annotations.empty" domain="agentation.mod" /></p>
                    <button type="button" class="btn btn-default" data-agentation-action="reload">
                        <core:icon identifier="actions-refresh" size="small" />
                        <f:translate key="annotations.reload" domain="agentation.mod" />
                    </button>
                </div>
                <div class="table-fit" data-agentation-table hidden>
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th scope="col"><f:translate key="annotations.column.comment" domain="agentation.mod" /></th>
                                <th scope="col"><f:translate key="annotations.column.element" domain="agentation.mod" /></th>
                                <th scope="col"><f:translate key="annotations.column.page" domain="agentation.mod" /></th>
                                <th scope="col"><f:translate key="annotations.column.status" domain="agentation.mod" /></th>
                                <th scope="col" class="col-control"><span class="visually-hidden"><f:translate key="annotations.column.actions" domain="agentation.mod" /></span></th>
                            </tr>
                        </thead>
                        <tbody data-agentation-rows></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

</f:section>

<f:section name="Switch">
    <f:if condition="{enabled}">
        <f:then><span><typo3-backend-status-indicator state="success"></typo3-backend-status-indicator> <f:translate key="status.enabled" domain="agentation.mod" /></span></f:then>
        <f:else><span><typo3-backend-status-indicator state="disabled"></typo3-backend-status-indicator> <f:translate key="status.disabled" domain="agentation.mod" /></span></f:else>
    </f:if>
</f:section>

</html>
